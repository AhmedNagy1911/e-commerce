services:
  sql:
      image: mcr.microsoft.com/mssql/server:2022-latest
      environment:
        ACCEPT_EULA: "Y"
        SA_PASSWORD: "YourStrong!Passw0rd"
      platform: "linux/amd64"
      ports:
        - "1433:1433" 
      volumes:
        - sql-data:/var/opt/mssql
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
volumes:
  sql-data:
  redis-data:
        